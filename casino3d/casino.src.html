<style>
/* Layout: full-bleed WebGL hall; HUD floats at the edges — marquee top-left, chip purse top-right, bet rail along the bottom. */
:root{
  --ink:#06080a; --emerald:#0c2b26; --gold:#e3b95e; --gold-hi:#fff0c2; --crimson:#b3122e; --ivory:#f6efe0;
  --glass:rgba(7,11,12,.66); --line:rgba(227,185,94,.42); --mute:rgba(246,239,224,.66);
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--ivory);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.hud{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px)}
.hud > *{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(1.15rem,3.6vw,2rem);letter-spacing:.14em;line-height:1;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#9a6b1c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.8))}
.brand p{margin:6px 0 0;font-size:.72rem;letter-spacing:.22em;color:var(--mute);text-shadow:0 1px 6px #000}
.brand p b{color:var(--gold);letter-spacing:.08em;font-weight:500}
.purse{pointer-events:auto;text-align:right;background:var(--glass);border:1px solid var(--line);padding:8px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.purse span{display:block;font-size:.66rem;letter-spacing:.2em;color:var(--mute)}
.purse strong{font-family:var(--display);font-size:clamp(1.05rem,3vw,1.5rem);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.views{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.views::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--glass);border-radius:0}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.views button{flex:none;padding:7px 12px;font-size:.78rem;letter-spacing:.04em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.views button[aria-pressed="true"]{background:var(--gold);color:#1a1204;border-color:var(--gold-hi);font-weight:700}
.spacer{flex:1;pointer-events:none;display:flex;align-items:center;justify-content:center;min-height:0}
.toast{pointer-events:none;text-align:center;font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,7vw,3.6rem);letter-spacing:.08em;color:var(--gold-hi);
  text-shadow:0 0 24px rgba(227,185,94,.9),0 4px 18px #000;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.toast small{display:block;font-family:var(--body);font-weight:500;font-size:clamp(.85rem,2.6vw,1.1rem);letter-spacing:.05em;color:var(--ivory);margin-top:6px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.rail{align-self:center;width:100%;max-width:680px;background:var(--glass);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.rail h2{margin:0;font-family:var(--display);font-size:.8rem;letter-spacing:.24em;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rail h2 span{font-family:var(--body);letter-spacing:.02em;font-size:.72rem;color:var(--mute);font-weight:400}
.bets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.bet{padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;border-width:1px;position:relative;min-width:0}
.bet b{font-family:var(--display);font-size:1.25rem;line-height:1.1}
.bet i{font-style:normal;font-size:.62rem;color:var(--mute)}
.bet em{font-style:normal;font-size:.68rem;font-variant-numeric:tabular-nums;color:var(--gold-hi);min-height:1em}
.bet[data-on="1"]{border-color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold-hi),0 0 14px rgba(227,185,94,.45)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.chips{display:flex;gap:6px;flex:1 1 220px;min-width:0}
.chip{flex:1;padding:8px 0;font-size:.78rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--emerald);border-color:var(--gold-hi);color:var(--gold-hi);font-weight:700}
#clear{padding:8px 12px;font-size:.78rem}
#spin{flex:1 1 130px;padding:9px 18px;font-family:var(--display);font-weight:900;letter-spacing:.2em;font-size:1rem;color:#1a1204;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,#a87722);border-color:var(--gold-hi)}
#spin:disabled{filter:grayscale(.7) brightness(.6);cursor:default}
.note{margin:0;font-size:.64rem;color:var(--mute);text-align:center}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ink);z-index:5;transition:opacity .8s;
  font-family:var(--display);letter-spacing:.3em;color:var(--gold);text-align:center;padding:16px}
#loader small{font-family:var(--body);letter-spacing:.05em;color:var(--mute)}
#loader.gone{opacity:0;pointer-events:none}
@media (max-width:520px){.brand p{font-size:.6rem;letter-spacing:.12em}.rail{padding:8px}.bet b{font-size:1.05rem}}
@media (max-height:520px){.rail h2,.note{display:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const fail=msg=>{$('loadmsg').textContent=msg;};
if(!window.THREE){fail('3D 엔진을 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.');return;}
const T=THREE, PI=Math.PI, TAU=PI*2;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- game data ---------- */
const SYMS=[
  {k:'1', pay:1, n:24,bg:'#cdb98a',fg:'#1a1408'},
  {k:'2', pay:2, n:15,bg:'#0e7a5a',fg:'#fff0c2'},
  {k:'5', pay:5, n:7, bg:'#1c3fa8',fg:'#fff0c2'},
  {k:'10',pay:10,n:4, bg:'#5a1f8c',fg:'#fff0c2'},
  {k:'20',pay:20,n:2, bg:'#b3122e',fg:'#fff0c2'},
  {k:'★', pay:40,n:2, bg:'#0b0b0d',fg:'#e3b95e'}
];
const NSEG=54, SEG=TAU/NSEG;
const LAYOUT=(function(){
  const s=new Array(NSEG).fill(null), offs={'★':0,'20':.5,'10':.25,'5':.4,'2':.3,'1':0};
  SYMS.slice().sort((a,b)=>a.n-b.n).forEach(sym=>{
    for(let j=0;j<sym.n;j++){let p=Math.round((j+offs[sym.k])*NSEG/sym.n)%NSEG;while(s[p])p=(p+1)%NSEG;s[p]=sym;}
  });
  return s;
})();
const CHIPS=[100,500,1000,5000];
let bal=100000, chip=500, bets={}, spinning=false;
const fmt=n=>n.toLocaleString('ko-KR');
function save(){try{localStorage.setItem('aurelia.bal',String(bal));}catch(e){}}
try{const v=parseInt(localStorage.getItem('aurelia.bal'),10);if(v>0)bal=v;}catch(e){}

/* ---------- helpers ---------- */
let seed=20261127;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function ctex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;
  if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
function goldGrad(g,y0,y1){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,'#fff3c8');gr.addColorStop(.5,'#e3b95e');gr.addColorStop(1,'#9a6b1c');return gr;}

let renderer;
const canvas=$('stage');
try{renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){fail('이 기기에서는 WebGL을 사용할 수 없어 3D 홀을 표시할 수 없습니다.');return;}
let pr=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(pr);
const scene=new T.Scene();
scene.background=new T.Color(0x040506);
scene.fog=new T.FogExp2(0x070605,0.0055);
const camera=new T.PerspectiveCamera(50,1,0.3,400);

const W=110,D=84,H=26;           // hall size
const WZ=-30, WY=10.2, WR=7;     // big wheel centre + radius

/* ---------- batching ---------- */
const dummy=new T.Object3D();dummy.rotation.order='YXZ';
function Batch(geo,mat){this.g=geo;this.m=mat;this.l=[];}
Batch.prototype.add=function(x,y,z,ry,sx,sy,sz,rx,rz){
  dummy.position.set(x,y,z);dummy.rotation.set(rx||0,ry||0,rz||0);
  const a=sx===undefined?1:sx;dummy.scale.set(a,sy===undefined?a:sy,sz===undefined?a:sz);
  dummy.updateMatrix();this.l.push(dummy.matrix.clone());return this;};
Batch.prototype.build=function(parent){
  const im=new T.InstancedMesh(this.g,this.m,this.l.length);
  this.l.forEach((m,i)=>im.setMatrixAt(i,m));im.frustumCulled=false;(parent||scene).add(im);return im;};
// place in the local frame of P={x,z,r}
function at(b,P,lx,ly,lz,sx,sy,sz,rx){const c=Math.cos(P.r),s=Math.sin(P.r);b.add(P.x+lx*c+lz*s,ly,P.z-lx*s+lz*c,P.r,sx,sy,sz,rx);}

function start(hot){
if(hot&&hot.bal>0)bal=hot.bal;

/* ---------- environment map (gives the gold its reflections) ---------- */
(function(){
  const eq=ctex(1024,512,(g,w,h)=>{
    const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#5a4020');gr.addColorStop(.35,'#1c1610');gr.addColorStop(.6,'#0a0c0c');gr.addColorStop(1,'#050505');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
    const cols=['255,236,190','255,205,120','255,250,235','255,90,160','90,220,255','255,180,70'];
    for(let i=0;i<90;i++){
      const x=rnd()*w,y=rnd()*h*.62,r=6+rnd()*34,c=cols[i%cols.length===3||i%cols.length===4?(rnd()<.3?i%cols.length:0):i%cols.length];
      const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba('+c+',1)');rg.addColorStop(.3,'rgba('+c+',.55)');rg.addColorStop(1,'rgba('+c+',0)');
      g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);
    }
    g.fillStyle='rgba(255,225,160,.5)';g.fillRect(0,h*.06,w,5);
  });
  eq.mapping=T.EquirectangularReflectionMapping;
  const pm=new T.PMREMGenerator(renderer);
  scene.environment=pm.fromEquirectangular(eq).texture;pm.dispose();eq.dispose();
})();

/* ---------- shared materials ---------- */
const gold=new T.MeshStandardMaterial({color:0xe0ae4c,metalness:1,roughness:.22,envMapIntensity:1.6});
const goldSoft=new T.MeshStandardMaterial({color:0xcf9d3e,metalness:1,roughness:.42,envMapIntensity:1.3});
const lacquer=new T.MeshStandardMaterial({color:0x0a0a0c,metalness:.7,roughness:.16,envMapIntensity:1.4});
const wood=new T.MeshStandardMaterial({color:0x2a140a,metalness:.3,roughness:.35});
const velvet=new T.MeshStandardMaterial({color:0x8e0f26,roughness:.85,metalness:0,emissive:0x2a0308});
const ivory=new T.MeshStandardMaterial({color:0xa89c84,roughness:.35,metalness:.05,envMapIntensity:.45});
const warm=new T.MeshBasicMaterial({color:0xffd9a0});
const glowTex=ctex(128,128,(g,w)=>{const r=g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,w);});
function glow(color,size,op){const s=new T.Sprite(new T.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op===undefined?.6:op,blending:T.AdditiveBlending,depthWrite:false}));s.scale.set(size,size,1);return s;}
const box=new T.BoxGeometry(1,1,1), cyl=new T.CylinderGeometry(1,1,1,28), sph=new T.SphereGeometry(1,16,12);
function mesh(geo,mat,x,y,z,parent){const m=new T.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);(parent||scene).add(m);return m;}

/* ---------- floor, carpet ---------- */
const floorTex=ctex(1024,1024,(g,w)=>{
  g.fillStyle='#0b0b0d';g.fillRect(0,0,w,w);
  for(let i=0;i<70;i++){ // marble veining
    g.strokeStyle=rnd()<.3?'rgba(227,185,94,'+(.05+rnd()*.12)+')':'rgba(255,255,255,'+(.02+rnd()*.07)+')';
    g.lineWidth=.6+rnd()*2.2;g.beginPath();let x=rnd()*w,y=rnd()*w;g.moveTo(x,y);
    for(let k=0;k<5;k++){x+=(rnd()-.5)*340;y+=(rnd()-.5)*340;g.quadraticCurveTo(x+(rnd()-.5)*160,y+(rnd()-.5)*160,x,y);}g.stroke();
  }
  g.strokeStyle='rgba(227,185,94,.75)';g.lineWidth=5;g.strokeRect(0,0,w,w);
  g.lineWidth=3;g.beginPath();g.moveTo(w/2,40);g.lineTo(w-40,w/2);g.lineTo(w/2,w-40);g.lineTo(40,w/2);g.closePath();g.stroke();
  g.fillStyle='rgba(227,185,94,.85)';[[0,0],[w,0],[0,w],[w,w],[w/2,w/2]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],18,0,TAU);g.fill();});
},[11,8.4]);
const floor=mesh(new T.PlaneGeometry(W,D),new T.MeshStandardMaterial({map:floorTex,roughness:.14,metalness:.6,envMapIntensity:1.25}));
floor.rotation.x=-PI/2;
const carpetTex=ctex(256,512,(g,w,h)=>{
  g.fillStyle='#7d0c22';g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(40,0,8,.5)';g.lineWidth=2;
  for(let y=-w;y<h+w;y+=64){g.beginPath();g.moveTo(w/2,y);g.lineTo(w-34,y+w/2-34);g.lineTo(w/2,y+w-68);g.lineTo(34,y+w/2-34);g.closePath();g.stroke();}
  g.fillStyle='#e3b95e';g.fillRect(8,0,7,h);g.fillRect(w-15,0,7,h);g.fillStyle='#3d0410';g.fillRect(20,0,5,h);g.fillRect(w-25,0,5,h);
},[1,8]);
const carpet=mesh(new T.PlaneGeometry(12,62),new T.MeshStandardMaterial({map:carpetTex,roughness:.9,emissive:0xffffff,emissiveMap:carpetTex,emissiveIntensity:.22}),0,.03,11);
carpet.rotation.x=-PI/2;
const rosette=ctex(512,512,(g,w)=>{
  g.translate(w/2,w/2);g.fillStyle='#0c2b26';g.beginPath();g.arc(0,0,250,0,TAU);g.fill();
  for(let i=0;i<32;i++){g.rotate(TAU/32);g.fillStyle=i%2?'#e3b95e':'#7d0c22';g.beginPath();g.moveTo(0,0);g.lineTo(-18,-236);g.lineTo(18,-236);g.closePath();g.fill();}
  g.fillStyle='#0b0b0d';g.beginPath();g.arc(0,0,92,0,TAU);g.fill();g.strokeStyle='#e3b95e';g.lineWidth=8;g.stroke();g.beginPath();g.arc(0,0,246,0,TAU);g.stroke();
});
const ros=mesh(new T.CircleGeometry(9,64),new T.MeshStandardMaterial({map:rosette,roughness:.8,emissive:0xffffff,emissiveMap:rosette,emissiveIntensity:.25}),0,.05,8);
ros.rotation.x=-PI/2;

/* ---------- walls, ceiling ---------- */
const wallTex=ctex(256,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#0a2a25');gr.addColorStop(.7,'#0e3a32');gr.addColorStop(1,'#061512');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.strokeStyle='#e3b95e';g.lineWidth=3;g.strokeRect(14,14,w-28,h-90);g.lineWidth=1.2;g.strokeRect(24,24,w-48,h-110);
  for(let i=0;i<9;i++){g.beginPath();g.arc(w/2,150,22+i*13,PI,TAU);g.globalAlpha=.9-i*.08;g.stroke();} // deco fan
  g.globalAlpha=1;for(let i=-4;i<=4;i++){g.beginPath();g.moveTo(w/2+i*13,160);g.lineTo(w/2+i*22,h-96);g.globalAlpha=.35;g.stroke();}
  g.globalAlpha=1;g.fillStyle='#0b0b0d';g.fillRect(0,h-62,w,62);g.fillStyle='#e3b95e';g.fillRect(0,h-66,w,5);g.fillRect(0,h-8,w,3);g.fillRect(0,0,5,h);
});
function wall(w,x,z,ry,rep){const t=wallTex.clone();t.needsUpdate=true;t.wrapS=T.RepeatWrapping;t.repeat.set(rep,1);
  const m=mesh(new T.PlaneGeometry(w,H),new T.MeshStandardMaterial({map:t,roughness:.75,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.5}),x,H/2,z);m.rotation.y=ry;}
wall(W,0,-D/2,0,11);wall(W,0,D/2,PI,11);wall(D,-W/2,0,PI/2,8);wall(D,W/2,0,-PI/2,8);

function chandelier(x,z,sc,drop){
  const G=new T.Group();G.position.set(x,H,z);G.scale.setScalar(sc);scene.add(G);
  const rod=mesh(cyl,gold,0,-drop/2,0,G);rod.scale.set(.09,drop,.09);
  const cr=[];const tiers=[[3.4,0,44],[2.5,-1.3,34],[1.5,-2.4,22],[.6,-3.3,10]];
  tiers.forEach(t=>{
    const ring=mesh(new T.TorusGeometry(t[0],.09,8,56),gold,0,-drop+t[1],0,G);ring.rotation.x=PI/2;
    for(let i=0;i<t[2];i++){const a=i/t[2]*TAU;for(let k=0;k<5;k++)cr.push([Math.cos(a)*t[0],-drop+t[1]-.22-k*.3-(i%2)*.12,Math.sin(a)*t[0],k===4?1.5:1]);}
  });
  for(let i=0;i<16;i++){const a=i/16*TAU;for(let k=0;k<9;k++){const u=k/9;cr.push([Math.cos(a)*(3.4*(1-u)+.2*u),-drop+u*drop*.82-Math.sin(u*PI)*.5,Math.sin(a)*(3.4*(1-u)+.2*u),.8]);}}
  const im=new T.InstancedMesh(new T.OctahedronGeometry(.085,0),new T.MeshBasicMaterial({color:0xffffff}),cr.length);
  const col=new T.Color();
  cr.forEach((c,i)=>{dummy.position.set(c[0],c[1],c[2]);dummy.rotation.set(0,rnd()*3,0);dummy.scale.set(c[3],c[3]*2,c[3]);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix);
    const b=.35+rnd()*.85;col.setRGB(b,b*.9,b*.68);im.setColorAt(i,col);});
  im.frustumCulled=false;G.add(im);
  const gl=glow(0xffd9a0,11,.5);gl.position.y=-drop-1.4;G.add(gl);
  chands.push(G);return G;
}

const clock=new T.Clock(),bc=new T.Color();let frame=0,slow=0,fpsT=0,fpsN=0,time=0;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.1);time+=dt;frame++;
  // adaptive quality
  fpsT+=dt;fpsN++;if(fpsT>2){const fps=fpsN/fpsT;fpsT=0;fpsN=0;
    if(fps<26&&time>4){slow++;if(pr>1){pr=Math.max(1,pr-.4);resize();}else if(bloom&&bloom.enabled&&slow>1){bloom.enabled=false;}}}
  // wheel
  if(spinS){spinS.u=Math.min(1,spinS.u+dt/spinS.d);ang=spinS.a0+(spinS.a1-spinS.a0)*(1-Math.pow(1-spinS.u,3.6));
    const peg=Math.floor(ang/SEG+.5);if(peg!==lastPeg){lastPeg=peg;flap=.55;blip(1500+Math.random()*200,.03,'square',.05);}
    if(spinS.u>=1)settle();}
  else if(!reduced){ang+=dt*.05;lastPeg=Math.floor(ang/SEG+.5);}
  wheel.rotation.z=ang;flap=Math.max(0,flap-dt*5);pointer.rotation.z=-flap;
  gem.rotation.z=-ang*2;burst.rotation.z=-time*.04;
  winFlash=Math.max(0,winFlash-dt);
  for(let i=0;i<NSEG;i++){let b;
    if(winFlash>0)b=Math.sin(time*18)>0?1.3:.15;
    else{const ph=i/NSEG*3-time*(spinS?2.4:.55);b=Math.pow(Math.max(0,Math.sin(ph*TAU)),3)*1.2+.18;}
    bc.setRGB(b,b*.78,b*.38);bulbs.setColorAt(i,bc);}
  bulbs.instanceColor.needsUpdate=true;
  wheelGlow.material.opacity=.2+.06*Math.sin(time*2)+(winFlash>0?.25:0);
  // ambience
  chands.forEach((c,i)=>{c.rotation.y=time*.05*(i%2?-1:1);});
  diamond.rotation.y=time*.6;diamond.position.y=3.5+Math.sin(time*1.2)*.12;
  rSpin.forEach(r=>{r.d.rotation.z=time*1.1+r.ph;const a=-time*2.3+r.ph;r.ball.position.set(r.x+Math.cos(a)*.82,1.31,r.z+Math.sin(a)*.82);});
  neon.forEach((m,i)=>m.color.setHSL((time*.07+i*.33)%1,1,.56));
  pM.color.setHSL((time*.05+.9)%1,1,.6);pC.color.setHSL((time*.05+.5)%1,1,.6);
  beams.forEach(b=>{const i=b.userData.i;b.rotation.z=Math.sin(time*.5+i*1.7)*.35+(b.position.x>0?.25:-.25);b.rotation.x=-.5+Math.sin(time*.37+i)*.22;});
  dust.rotation.y=time*.012;dust.position.y=Math.sin(time*.3)*.4;
  if(frame%2===0)drawReels(time);
  if(confT>=0){confT+=dt;for(let i=0;i<CN;i++){cV[i*3+1]-=9*dt;cP[i*3]+=cV[i*3]*dt;cP[i*3+1]+=cV[i*3+1]*dt;cP[i*3+2]+=cV[i*3+2]*dt;if(cP[i*3+1]<.1){cP[i*3+1]=.1;cV[i*3]*=.9;cV[i*3+2]*=.9;cV[i*3+1]=0;}}
    cGeo.attributes.position.needsUpdate=true;conf.material.opacity=Math.max(0,1-confT/5);if(confT>5){confT=-1;conf.visible=false;}}
  // camera
  if(mode==='tour'){tourT=(tourT+dt/95)%1;const k=1-Math.exp(-dt*1.6);camPos.lerp(tourPos.getPointAt(tourT),k);camTgt.lerp(tourTgt.getPointAt(tourT),k);}
  else if(mode==='fly'&&fly){fly.u=Math.min(1,fly.u+dt/fly.d);const e=ease(fly.u);camPos.lerpVectors(fly.p0,fly.p1,e);camTgt.lerpVectors(fly.t0,fly.t1,e);if(fly.u>=1){fly=null;mode='orbit';syncOrbit();}}
  else{const k=1-Math.exp(-dt*9);sphC.theta+=(sphD.theta-sphC.theta)*k;sphC.phi+=(sphD.phi-sphC.phi)*k;sphC.radius+=(sphD.radius-sphC.radius)*k;
    camTgt.copy(orbitTgt);camPos.setFromSpherical(sphC).add(orbitTgt);}

}

  catch(e){console.error(e);fail('3D 홀을 여는 중 오류가 발생했습니다: '+e.message);}};
  let done=false;const once=()=>{if(!done){done=true;go();}};
  try{Promise.all([document.fonts.load('900 96px Cinzel'),document.fonts.load('700 30px Cinzel')]).then(once,once);}catch(e){once();}
  setTimeout(once,2500);}
boot();
})();
</script>
