<style>
/* Layout: full-bleed first-person 3D floor; HUD floats at the edges — RFL crest top-left, chip purse top-right, walk controls and bet rail along the bottom. */
:root{
  --night:#07050c; --emerald:#0c2b26; --gold:#e6c878; --gold-hi:#fff3ce; --crimson:#b3122e; --ivory:#f6efdf;
  --glass:rgba(7,5,12,.68); --line:rgba(230,200,120,.45); --mute:#b3a58c;
  --display:'Playfair Display SC','Didot',Georgia,serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ivory);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px)}
.hud > *{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(1.1rem,3.4vw,1.9rem);letter-spacing:.1em;line-height:1;
  background:linear-gradient(100deg,#7a5a1a,var(--gold) 18%,var(--gold-hi) 32%,#c9a24a 50%,#fff0c0 66%,#9c7426 84%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.85))}
.brand p{margin:6px 0 0;font-size:.68rem;letter-spacing:.2em;color:var(--mute);text-shadow:0 1px 6px #000}
.purse{pointer-events:auto;text-align:right;background:var(--glass);border:1px solid var(--line);padding:8px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.purse span{display:block;font-size:.64rem;letter-spacing:.18em;color:var(--mute)}
.purse strong{font-family:var(--display);font-size:clamp(1rem,3vw,1.45rem);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.views{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.views::-webkit-scrollbar{display:none}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--glass);border-radius:0;text-decoration:none}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.views button{flex:none;padding:7px 12px;font-size:.78rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.views button[aria-pressed="true"]{background:var(--gold);color:#1a1204;border-color:var(--gold-hi);font-weight:700}
.spacer{flex:1;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:14px}
.toast{pointer-events:none;text-align:center;font-family:var(--display);font-weight:900;font-size:clamp(1.4rem,6vw,3rem);letter-spacing:.06em;color:var(--gold-hi);
  text-shadow:0 0 24px rgba(230,200,120,.9),0 4px 18px #000;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.toast small{display:block;font-family:var(--body);font-weight:500;font-size:clamp(.82rem,2.6vw,1.05rem);letter-spacing:.03em;color:var(--ivory);margin-top:6px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#enter{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 26px 14px;background:rgba(7,5,12,.5);border:1px solid var(--gold);
  font-weight:700;letter-spacing:.2em;font-size:.9rem;color:var(--gold-hi);animation:beckon 1.4s ease-in-out infinite;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#enter svg{width:54px;height:54px}
@keyframes beckon{0%,100%{transform:translateY(0);box-shadow:0 0 0 rgba(230,200,120,0)}50%{transform:translateY(-8px);box-shadow:0 0 34px rgba(230,200,120,.55)}}
.walk{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:center}
#fwd{width:74px;height:74px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
#fwd svg{width:34px;height:34px}
#fwd:active{background:var(--gold);color:#1a1204}
.hint{margin:0;font-size:.72rem;color:var(--ivory);text-shadow:0 1px 6px #000,0 0 2px #000;text-align:center}
.rail{align-self:center;width:100%;max-width:680px;background:var(--glass);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.rail h2{margin:0;font-family:var(--display);font-size:.8rem;letter-spacing:.2em;color:var(--gold);display:flex;justify-content:space-between;align-items:center;gap:8px}
.rail h2 span{font-family:var(--body);letter-spacing:.02em;font-size:.72rem;color:var(--mute);font-weight:400}
.rail h2 button{font-family:var(--body);letter-spacing:0;font-size:.72rem;padding:4px 10px;color:var(--ivory)}
.bets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.bet{padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.bet b{font-family:var(--display);font-size:1.25rem;line-height:1.1}
.bet i{font-style:normal;font-size:.62rem;opacity:.8}
.bet em{font-style:normal;font-size:.68rem;font-variant-numeric:tabular-nums;color:var(--gold-hi);min-height:1em}
.bet[data-on="1"]{border-color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold-hi),0 0 14px rgba(230,200,120,.45)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.chips{display:flex;gap:6px;flex:1 1 220px;min-width:0}
.chip{flex:1;padding:8px 0;font-size:.78rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--emerald);border-color:var(--gold-hi);color:var(--gold-hi);font-weight:700}
#clear{padding:8px 12px;font-size:.78rem}
#spin,.cta{flex:1 1 130px;padding:9px 18px;font-family:var(--display);font-weight:900;letter-spacing:.18em;font-size:1rem;color:#1a1204;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,#a87722);border-color:var(--gold-hi);text-align:center}
#spin:disabled{filter:grayscale(.7) brightness(.6);cursor:default}
.note{margin:0;font-size:.64rem;color:var(--mute);text-align:center}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;transition:opacity .8s;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,rgba(7,5,12,.55),var(--night) 75%);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#gate.solid{background:var(--night)}
#gate .crest{font-size:.72rem;letter-spacing:.34em;color:var(--mute)}
#gate h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(1.9rem,8vw,4rem);letter-spacing:.08em;color:var(--gold);line-height:1.05;text-wrap:balance}
#gate p{margin:0;max-width:34em;color:var(--ivory);font-size:.9rem;line-height:1.6}
#gate .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#gate button{padding:12px 22px;font-size:.9rem;flex:none}
#gate.gone{opacity:0;pointer-events:none}
#game{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;background:rgba(7,5,12,.9);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--night)}
.gbar strong{font-family:var(--display);font-size:1.1rem;color:var(--gold);letter-spacing:.06em}
.gbar span{font-size:.8rem;color:var(--mute);flex:1;min-width:0}
.gbar .btn,.gbar button{padding:7px 12px;font-size:.78rem}
#gbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#gbody iframe{width:100%;height:100%;border:0;background:var(--night)}
.gcard{max-width:30em;margin:16px;padding:24px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;gap:14px;text-align:center}
.gcard h3{margin:0;font-family:var(--display);font-size:1.6rem;color:var(--gold-hi)}
.gcard p{margin:0;line-height:1.6;font-size:.9rem}
.gcard .cta{flex:none;display:block}
@media (max-width:520px){.brand p{font-size:.58rem;letter-spacing:.1em}.rail{padding:8px}.bet b{font-size:1.05rem}}
@media (max-height:520px){.note,.hint{display:none}#fwd{width:56px;height:56px}}
@media (prefers-reduced-motion:reduce){.toast,#enter{animation:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const fail=msg=>{$('gatemsg').textContent=msg;};
if(!window.THREE){fail('3D 엔진을 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.');return;}
const T=THREE, PI=Math.PI, TAU=PI*2;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- RFL games (rfl-cruise-casino) ---------- */
const GAME_BASE='https://rfl-cruise-casino.netlify.app';
const GAMES={
  roulette:{name:'Royal Roulette',ko:'로열 룰렛',path:'/roulette',desc:'마호가니와 금으로 만든 휠, 실제처럼 굴러가는 볼. 스트레이트 35:1.'},
  holdem:{name:"Royal Hold'em",ko:'로열 홀덤',path:'/holdem',desc:'딜러와 1:1 텍사스 홀덤. 체크·콜·레이즈·올인.'},
  blackjack:{name:'Royal Blackjack',ko:'로열 블랙잭',path:'/blackjack',desc:'6덱 슈, 더블·스플릿·보험, 기본 전략 힌트.'},
  slot:{name:'Diamond Royal',ko:'다이아몬드 로열 슬롯',path:'/slot',desc:'5릴 8–25라인. 와일드, 프리 스핀 ×3, 로열 잭팟.'},
  baccarat:{name:'Baccarat Salon',ko:'바카라 살롱',path:null,desc:'바카라는 RFL 크루즈 카지노에 아직 게임이 준비되지 않아 관전만 가능합니다. 같은 카드 테이블 게임인 로열 블랙잭으로 안내해 드립니다.',alt:'blackjack'}
};
// other sites cannot be framed inside a claude.ai artifact; on the RFL site itself the game opens in place
const CAN_EMBED=!(window.claude||/claude|anthropic/.test(location.hostname));

/* ---------- wheel data ---------- */
const SYMS=[
  {k:'1', pay:1, n:24,bg:'#cdb98a',fg:'#1a1408'},
  {k:'2', pay:2, n:15,bg:'#0e7a5a',fg:'#fff3ce'},
  {k:'5', pay:5, n:7, bg:'#1c3fa8',fg:'#fff3ce'},
  {k:'10',pay:10,n:4, bg:'#5a1f8c',fg:'#fff3ce'},
  {k:'20',pay:20,n:2, bg:'#b3122e',fg:'#fff3ce'},
  {k:'40',pay:40,n:2, bg:'#0b0b0d',fg:'#e6c878',crown:true}
];
const NSEG=54, SEG=TAU/NSEG;
const LAYOUT=(function(){
  const s=new Array(NSEG).fill(null), offs={'40':0,'20':.5,'10':.25,'5':.4,'2':.3,'1':0};
  SYMS.slice().sort((a,b)=>a.n-b.n).forEach(sym=>{
    for(let j=0;j<sym.n;j++){let p=Math.round((j+offs[sym.k])*NSEG/sym.n)%NSEG;while(s[p])p=(p+1)%NSEG;s[p]=sym;}
  });
  return s;
})();
const CHIPS=[100,500,1000,5000];
let bal=100000, chip=500, bets={}, spinning=false;
const fmt=n=>n.toLocaleString('ko-KR');
function save(){try{localStorage.setItem('rflcasino.bal',String(bal));}catch(e){}}
try{const v=parseInt(localStorage.getItem('rflcasino.bal'),10);if(v>0)bal=v;}catch(e){}

/* ---------- helpers ---------- */
let seed=20261127;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const pick=a=>a[rnd()*a.length|0], R=Math.random;
function ctex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;
  if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
function goldGrad(g,y0,y1){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,'#fff3ce');gr.addColorStop(.5,'#e6c878');gr.addColorStop(1,'#9c7426');return gr;}
const FONT='"Playfair Display SC", "Noto Sans KR", Georgia, serif';

let renderer;
const canvas=$('stage');
try{renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){fail('이 기기에서는 WebGL을 사용할 수 없어 3D 카지노를 표시할 수 없습니다.');return;}
let pr=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(pr);
const scene=new T.Scene();
scene.background=new T.Color(0x040506);
scene.fog=new T.FogExp2(0x070605,0.0048);
const camera=new T.PerspectiveCamera(58,1,0.15,400);
camera.rotation.order='YXZ';

const W=110,D=84,H=26,EYE=1.65;  // hall size, eye height
const WZ=-32, WY=10.2, WR=7;     // big wheel centre + radius
const DOORW=5, DOORH=7.5, LOBD=20, LOBW=32;

/* ---------- batching ---------- */
const dummy=new T.Object3D();dummy.rotation.order='YXZ';
function Batch(geo,mat){this.g=geo;this.m=mat;this.l=[];}
Batch.prototype.add=function(x,y,z,ry,sx,sy,sz,rx,rz){
  dummy.position.set(x,y,z);dummy.rotation.set(rx||0,ry||0,rz||0);
  const a=sx===undefined?1:sx;dummy.scale.set(a,sy===undefined?a:sy,sz===undefined?a:sz);
  dummy.updateMatrix();this.l.push(dummy.matrix.clone());return this;};
Batch.prototype.build=function(parent){
  const im=new T.InstancedMesh(this.g,this.m,this.l.length);
  this.l.forEach((m,i)=>im.setMatrixAt(i,m));im.frustumCulled=false;(parent||scene).add(im);return im;};
function loc(P,lx,lz){const c=Math.cos(P.r),s=Math.sin(P.r);return [P.x+lx*c+lz*s,P.z-lx*s+lz*c];}
function at(b,P,lx,ly,lz,sx,sy,sz,rx){const p=loc(P,lx,lz);b.add(p[0],ly,p[1],P.r,sx,sy,sz,rx);}

function start(hot){
if(hot&&hot.bal>0)bal=hot.bal;
let time=0;

/* ---------- environment map ---------- */
(function(){
  const eq=ctex(1024,512,(g,w,h)=>{
    const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#5a4020');gr.addColorStop(.35,'#1c1610');gr.addColorStop(.6,'#0a0c0c');gr.addColorStop(1,'#050505');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
    const cols=['255,236,190','255,205,120','255,250,235','255,90,160','90,220,255','255,180,70'];
    for(let i=0;i<90;i++){
      const x=rnd()*w,y=rnd()*h*.62,r=6+rnd()*34,k=i%6,c=cols[(k===3||k===4)&&rnd()>.3?0:k];
      const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba('+c+',1)');rg.addColorStop(.3,'rgba('+c+',.55)');rg.addColorStop(1,'rgba('+c+',0)');

  if(composer){composer.setPixelRatio(pr);composer.setSize(w,h);}camera.aspect=w/h;camera.fov=w<h?72:58;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* ---------- betting HUD ---------- */
const betsEl=$('bets'),chipsEl=$('chips'),toast=$('toast');let toastTimer=0;
let ang=0,spinS=null,flap=0,lastPeg=0,winFlash=0,npcSpinT=9;
SYMS.forEach(s=>{const b=document.createElement('button');b.className='bet';b.id='bet-'+s.pay;b.dataset.k=s.k;
  b.style.background='linear-gradient(180deg,'+s.bg+',rgba(0,0,0,.55) 160%)';b.style.color=s.fg;
  const t=document.createElement('b');t.textContent=s.k;const i=document.createElement('i');i.textContent=s.crown?'크라운 40배':s.pay+'배';const em=document.createElement('em');
  b.appendChild(t);b.appendChild(i);b.appendChild(em);b.setAttribute('aria-label',(s.crown?'크라운':s.k)+' 구역에 베팅, 배당 '+s.pay+'배');
  b.addEventListener('click',()=>{if(spinning)return;if(bal<chip){say('칩이 부족합니다','칩 교환소에서 칩을 받거나 더 작은 칩을 고르세요',2000);return;}
    bal-=chip;bets[s.k]=(bets[s.k]||0)+chip;click(900,.05);paint();});
  betsEl.appendChild(b);});
CHIPS.forEach(c=>{const b=document.createElement('button');b.className='chip';b.id='chip-'+c;b.textContent=fmt(c);b.addEventListener('click',()=>{chip=c;paint();});chipsEl.appendChild(b);});
function paint(){
  $('bal').textContent=fmt(bal);let tot=0;
  betsEl.querySelectorAll('.bet').forEach(b=>{const v=bets[b.dataset.k]||0;tot+=v;b.querySelector('em').textContent=v?fmt(v):'';b.dataset.on=v?'1':'0';});
  chipsEl.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.id==='chip-'+chip?'true':'false'));
  $('stake').textContent=spinning&&spinS&&spinS.npc?'다른 손님의 판이 도는 중…':'베팅 '+fmt(tot);$('spin').disabled=spinning;$('clear').disabled=spinning;
}
function say(big,small,ms){toast.innerHTML='';toast.appendChild(document.createTextNode(big));if(small){const s=document.createElement('small');s.textContent=small;toast.appendChild(s);}
  toast.hidden=false;toast.style.animation='none';void toast.offsetWidth;toast.style.animation='';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true;},ms||3200);}
function refund(){for(const k in bets)bal+=bets[k];bets={};}
$('clear').addEventListener('click',()=>{if(spinning)return;refund();paint();});
$('wleave').addEventListener('click',()=>{if(mode!=='wheel')return;if(!(spinning&&spinS&&!spinS.npc))refund();paint();setMode('walk');cam.pitch=0;});
function startSpin(npc){
  const k=Math.floor(R()*NSEG),turns=4+Math.floor(R()*3);
  let target=(k+(R()-.5)*.7)*SEG;target+=Math.ceil((ang-target)/TAU)*TAU+turns*TAU;
  spinS={a0:ang,a1:target,u:0,d:reduced?4:9.5,npc};spinning=true;paint();
}
$('spin').addEventListener('click',()=>{
  if(spinning)return;let tot=0;for(const k in bets)tot+=bets[k];
  if(!tot){say('베팅을 올려주세요','숫자 구역을 눌러 칩을 올린 뒤 SPIN');return;}
  startSpin(false);
});
function settle(){
  const idx=((Math.round(ang/SEG)%NSEG)+NSEG)%NSEG,s=LAYOUT[idx],npc=spinS.npc,name=s.crown?'크라운':s.k;
  spinning=false;spinS=null;npcSpinT=14+R()*12;
  wheelGroup.people.forEach(i=>{if(R()<(s.pay>=5?.9:.4))gesture(i,2,2.4+R());});cheerAt(0,WZ+12,s.pay>=5);
  if(s.pay>=10){winFlash=4;confetti();}
  if(!npc){const stake=bets[s.k]||0;let tot=0;for(const k in bets)tot+=bets[k];
    if(stake){const win=stake*(s.pay+1);bal+=win;say(name+'  ·  '+s.pay+'배 당첨','+'+fmt(win-tot)+' 칩 (지급 '+fmt(win)+')',4200);confetti();winFlash=4;
      if(Au.c&&Au.on)[523,659,784,1047,1319].forEach((f,i)=>tone('fx',f,Au.c.currentTime+i*.11,.35,'triangle',.12));}
    else say(name,'이번 판은 아쉽게 놓쳤습니다',2600);
    bets={};if(bal<100){bal=100000;setTimeout(()=>say('하우스 리필','플레이 칩 100,000을 다시 드립니다'),2800);}save();}
  else if(mode==='wheel')say(name,'다른 손님의 판이 끝났습니다. 이제 베팅하세요',2200);
  paint();
}

/* ---------- nav ---------- */
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>flyDest(b.dataset.go)));
$('v-walk').addEventListener('click',()=>{if(mode==='tour')exitTour();});
$('v-tour').addEventListener('click',()=>{if(mode==='tour'){exitTour();return;}if(mode!=='walk')return;tP.set(cam.x,cam.y,cam.z);tT.set(cam.x+Math.sin(cam.yaw)*10,cam.y,cam.z+Math.cos(cam.yaw)*10);setMode('tour');say('시네마 투어','화면을 누르면 걷기로 돌아갑니다',2400);});
$('v-sound').addEventListener('click',e=>{Au.on=!Au.on;if(Au.on&&!Au.c){auInit();if(Au.c&&mode!=='lobby')Au.door.frequency.value=18000;}
  if(Au.c){if(Au.on)Au.c.resume();Au.master.gain.setTargetAtTime(Au.on?(mode==='lobby'?.55:1):0,Au.c.currentTime,.1);}e.currentTarget.setAttribute('aria-pressed',Au.on?'true':'false');});
$('enter').addEventListener('click',enterCasino);
function begin(sound){Au.on=sound;if(sound)auInit();if(Au.c)Au.c.resume();$('v-sound').setAttribute('aria-pressed',sound?'true':'false');$('gate').classList.add('gone');setMode('lobby');
  say('RFL CRUISE CASINO','화살표를 눌러 입장하세요',3600);}
$('g-sound').addEventListener('click',()=>begin(true));$('g-mute').addEventListener('click',()=>begin(false));
paint();setMode('gate');

/* ---------- ambient life ---------- */
const active=[];let gestT=0,cheerT=7,jackT=11,jackFlash=0;
function gesture(i,g,d){if(i<0||pFlag[i]&8||pG[i]===5)return;if(!pG[i])active.push(i);pG[i]=g;pGD[i]=d;pGT[i]=d;}
function life(dt){
  gestT-=dt;while(gestT<=0){gestT+=.022;const i=R()*nP|0;if(pG[i]||pFlag[i]&8)continue;gesture(i,(pFlag[i]&4)?1:(R()<.07?2:3),1.8+R()*1.6);}
  for(let k=active.length-1;k>=0;k--){const i=active[k];pGT[i]-=dt;if(pGT[i]<=0){pG[i]=0;active[k]=active[active.length-1];active.pop();}pose(i);}
  for(const i of always)if(i>=0)pose(i);
  for(const i of walkers){
    let a=nodes[wA[i]],b=nodes[wB[i]];wU[i]+=wSp[i]*dt/wLen[i];
    if(wU[i]>=1){const prev=wA[i];wA[i]=wB[i];const nb=nodes[wA[i]].n;let nx=nb[R()*nb.length|0];if(nx===prev&&nb.length>1)nx=nb[(nb.indexOf(nx)+1)%nb.length];
      wB[i]=nx;wU[i]=0;a=nodes[wA[i]];b=nodes[nx];wLen[i]=Math.hypot(b.x-a.x,b.z-a.z);}
    const u=wU[i];pX[i]=a.x+(b.x-a.x)*u+wOx[i];pZ[i]=a.z+(b.z-a.z)*u+wOz[i];
    pYaw[i]+=wrap(Math.atan2(b.x-a.x,b.z-a.z)-pYaw[i])*Math.min(1,dt*5);pPh[i]+=dt*wSp[i]*5.2;pose(i);}
  PK.forEach(k=>{P[k].instanceMatrix.needsUpdate=true;});trays.instanceMatrix.needsUpdate=true;
  cheerT-=dt;if(cheerT<=0){cheerT=5+R()*9;const g=groups[R()*groups.length|0];if(g!==wheelGroup){g.people.forEach(i=>gesture(i,2,2.2+R()));cheerAt(g.x,g.z,g.people.length>5);}}
  jackT-=dt;if(jackT<=0&&slotPlayers.length){jackT=13+R()*18;const sp=slotPlayers[R()*slotPlayers.length|0];gesture(sp.i,2,3.2);jackpotAt(sp.x,sp.z);jackGlow.position.set(sp.x,3.6,sp.z);jackFlash=3;}
  jackFlash=Math.max(0,jackFlash-dt);jackGlow.material.opacity=jackFlash>0?(.35+.35*Math.sin(time*22))*Math.min(1,jackFlash):0;
}

/* ---------- loop ---------- */
const clock=new T.Clock(),bc=new T.Color();let frame=0,slow=0,fpsT=0,fpsN=0;
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.1);time+=dt;frame++;
  const gaming=!$('game').hidden;if(gaming&&frame%6)return;
  fpsT+=dt;fpsN++;if(fpsT>2){const fps=fpsN/fpsT;fpsT=0;fpsN=0;
    if(fps<24&&time>5&&!gaming){slow++;if(pr>1){pr=Math.max(1,pr-.4);resize();}else if(bloom&&bloom.enabled&&slow>1){bloom.enabled=false;}}}
  // doors
  doorOpen+=(doorTarget-doorOpen)*Math.min(1,dt*1.6);doors.forEach(d=>{d.position.x=d.userData.s*(DOORW/2+doorOpen*(DOORW-.2));});
  // wheel — other guests keep it turning when the visitor is not playing
  if(!spinning&&mode!=='gate'){npcSpinT-=dt;let hasBet=false;for(const k in bets){hasBet=true;break;}if(npcSpinT<=0&&!(mode==='wheel'&&hasBet))startSpin(true);}
  if(spinS){spinS.u=Math.min(1,spinS.u+dt/spinS.d);ang=spinS.a0+(spinS.a1-spinS.a0)*(1-Math.pow(1-spinS.u,3.6));
    const peg=Math.floor(ang/SEG+.5);if(peg!==lastPeg){lastPeg=peg;flap=.55;if(Au.c&&Au.on)tone('fx',1500+R()*200,Au.c.currentTime,.03,'square',.02+.14*prox(0,WZ+10,12));}
    if(spinS.u>=1)settle();}
  wheel.rotation.z=ang;flap=Math.max(0,flap-dt*5);pointer.rotation.z=-flap;burst.rotation.z=-time*.04;
  winFlash=Math.max(0,winFlash-dt);
  for(let i=0;i<NSEG;i++){let b;
    if(winFlash>0)b=Math.sin(time*18)>0?1.3:.15;
    else{const ph=i/NSEG*3-time*(spinS?2.4:.55);b=Math.pow(Math.max(0,Math.sin(ph*TAU)),3)*1.2+.18;}
    bc.setRGB(b,b*.78,b*.38);bulbs.setColorAt(i,bc);}
  bulbs.instanceColor.needsUpdate=true;
  wheelGlow.material.opacity=.2+.06*Math.sin(time*2)+(winFlash>0?.25:0);
  // ambience
  chands.forEach((c,i)=>{c.rotation.y=time*.05*(i%2?-1:1);});
  diamond.rotation.y=time*.6;diamond.position.y=3.5+Math.sin(time*1.2)*.12;
  rSpin.forEach(r=>{r.d.rotation.z=time*1.1+r.ph;const a=-time*2.3+r.ph;r.ball.position.set(r.x+Math.cos(a)*.82,1.31,r.z+Math.sin(a)*.82);});
  neon.forEach((m,i)=>m.color.setHSL((time*.07+i*.33)%1,1,.56));
  pM.color.setHSL((time*.05+.9)%1,1,.6);pC.color.setHSL((time*.05+.5)%1,1,.6);
  beams.forEach(b=>{const i=b.userData.i;b.rotation.z=Math.sin(time*.5+i*1.7)*.35+(b.position.x>0?.25:-.25);b.rotation.x=-.5+Math.sin(time*.37+i)*.22;});
  dust.rotation.y=time*.012;
  if(frame%2===0)drawReels(time);
  if(confT>=0){confT+=dt;for(let i=0;i<CN;i++){cV[i*3+1]-=9*dt;cP[i*3]+=cV[i*3]*dt;cP[i*3+1]+=cV[i*3+1]*dt;cP[i*3+2]+=cV[i*3+2]*dt;if(cP[i*3+1]<.1){cP[i*3+1]=.1;cV[i*3]*=.9;cV[i*3+2]*=.9;cV[i*3+1]=0;}}
    cGeo.attributes.position.needsUpdate=true;conf.material.opacity=Math.max(0,1-confT/5);if(confT>5){confT=-1;conf.visible=false;}}
  life(dt);auTick(dt);
  // camera
  if(tw){tw.u=Math.min(1,tw.u+dt/tw.d);const e=ease(tw.u),f=tw.f,t=tw.t;
    cam.x=f.x+(t.x-f.x)*e;cam.z=f.z+(t.z-f.z)*e;cam.y=f.y+(t.y-f.y)*e+Math.sin(e*PI)*tw.arc;cam.yaw=f.yaw+wrap(t.yaw-f.yaw)*e;cam.pitch=f.pitch+(t.pitch-f.pitch)*e;
    if(tw.u>=1){const d=tw.done;tw=null;if(d)d();}}
  else if(mode==='walk'){
    let mx=0,mz=0;const fx=Math.sin(cam.yaw),fz=Math.cos(cam.yaw);
    const kf=(fwd||keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),ks=(keys.d?1:0)-(keys.a?1:0);
    if(keys.arrowleft)cam.yaw+=dt*1.8;if(keys.arrowright)cam.yaw-=dt*1.8;
    if(kf||ks){goTo=null;mx=fx*kf-fz*ks;mz=fz*kf+fx*ks;}
    else if(goTo){const dx=goTo.x-cam.x,dz=goTo.z-cam.z,d=Math.hypot(dx,dz);if(d<.35)goTo=null;else{mx=dx/d;mz=dz/d;if(!ptrs.size)cam.yaw+=wrap(Math.atan2(dx,dz)-cam.yaw)*Math.min(1,dt*1.6);}}
    if(mx||mz){const sp=4.2*dt;if(!tryMove(cam.x+mx*sp,cam.z+mz*sp)){stuck+=dt;if(stuck>.5)goTo=null;}else stuck=0;}
    cam.y+=(EYE+((mx||mz)?Math.sin(time*9)*.035:0)-cam.y)*Math.min(1,dt*8);
  }
  if(mode==='tour'){tourT=(tourT+dt/120)%1;const k=1-Math.exp(-dt*1.4);tP.lerp(tourPos.getPointAt(tourT),k);tT.lerp(tourTgt.getPointAt(tourT),k);camera.position.copy(tP);camera.lookAt(tT);}
  else{camera.position.set(cam.x,cam.y,cam.z);camera.rotation.set(cam.pitch,cam.yaw+PI,0);}
  // seat / join markers near the visitor
  if(frame%4===0)for(const h of hotspots){const d=Math.hypot(h.x-cam.x,h.z-cam.z);h.s.visible=mode==='walk'&&d<(h.type==='seat'?17:26);if(h.s.visible){const k=Math.max(.22,Math.min(1.25,d/9));h.s.scale.set(1.5*k,1.17*k,1);h.s.position.y=h.y-(1-Math.min(1,k))*.5+Math.sin(time*3+h.x)*.06;}}
  if(composer)composer.render(dt);else renderer.render(scene,camera);
  if(frame===3){$('gatemsg').textContent='입구에서 직원들이 기다리고 있습니다. 문 너머로 카지노 소리가 새어 나옵니다.';$('gaterow').hidden=false;$('gate').classList.remove('solid');}
}
tick();
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({bal}));}catch(e){}}
window.__rfl={people:()=>nP,mode:()=>mode,cam,hotspots,sitAt,joinWheel,audio:Au};
}

function boot(){const go=()=>{try{(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(start):start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});}
  catch(e){console.error(e);fail('3D 카지노를 여는 중 오류가 발생했습니다: '+e.message);}};
  let done=false;const once=()=>{if(!done){done=true;go();}};
  try{Promise.all([document.fonts.load('900 96px "Playfair Display SC"'),document.fonts.load('700 30px "Playfair Display SC"'),document.fonts.load('900 46px "Noto Sans KR"','앉기')]).then(once,once);}catch(e){once();}
  setTimeout(once,3000);}
boot();
})();
</script>
